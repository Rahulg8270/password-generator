<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <main class="app-container">
      <h1>Password Generator</h1>
      <section class="password-display-container">
        <h1 id="password-display" class="password-text">P1z5#k9L!q</h1>
        <button id="copy-btn" class="copy-btn" aria-label="Copy password">
          Copy
        </button>
      </section>

      <section class="controls-container">
        <div class="slider-group">
          <div class="slider-header">
            <label for="length-slider">Character Length</label>
            <span id="length-display" class="length-value">10</span>
          </div>
          <input
            type="range"
            id="length-slider"
            class="slider"
            min="1"
            max="20"
            value="10"
          />
        </div>

        <fieldset class="checkbox-group">
          <legend class="sr-only">Password Settings</legend>

          <div class="checkbox-wrapper">
            <input type="checkbox" id="uppercase" checked />
            <label for="uppercase">Include Uppercase Letters</label>
          </div>

          <div class="checkbox-wrapper">
            <input type="checkbox" id="lowercase" checked />
            <label for="lowercase">Include Lowercase Letters</label>
          </div>

          <div class="checkbox-wrapper">
            <input type="checkbox" id="numbers" checked />
            <label for="numbers">Include Numbers</label>
          </div>

          <div class="checkbox-wrapper">
            <input type="checkbox" id="symbols" />
            <label for="symbols">Include Symbols</label>
          </div>
        </fieldset>

        <div class="strength-container">
          <p>Strength</p>
          <div id="strength-bars" class="bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>

        <button id="generate-btn" class="generate-btn">Generate -></button>
      </section>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
